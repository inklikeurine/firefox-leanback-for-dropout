name: Claude

# Mention @claude in an issue, a pull request, or a comment on either, and
# Claude Code works on the repository and replies in the thread. Only people
# with write access to the repo can trigger it.
#
# It runs on the Claude subscription through the CLAUDE_CODE_OAUTH_TOKEN
# secret (made with `claude setup-token`), so it draws on the same usage
# limits as Claude Code on your computer.
#
# Claude follows AGENTS.md. The shared tools (firefox-tools) are cloned next
# to the repository, as on a developer's computer, so Claude can run the same
# checks the pull request checks run.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One run at a time per issue or pull request.
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # So Claude can run the validator, the tests and the live check before
      # it pushes (.claude/settings.json allows the ../firefox-tools commands).
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install the shared tools
        run: |
          git clone --depth 1 https://github.com/inklikeurine/firefox-tools ../firefox-tools
          npm ci --prefix ../firefox-tools
          npx --prefix ../firefox-tools playwright install --with-deps firefox

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Caps how long one request can run, to protect usage limits.
          claude_args: "--max-turns 25"
