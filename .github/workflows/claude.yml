name: Claude

# Mention @claude in an issue, a pull request, or a comment on either, and
# Claude Code works on the repository and replies in the thread. Only people
# with write access to the repo can trigger it.
#
# It runs on the Claude subscription through the CLAUDE_CODE_OAUTH_TOKEN
# secret (made with `claude setup-token`), so it draws on the same usage
# limits as Claude Code on your computer.
#
# The private workshop (../_workshop/) is not here, so Claude follows the
# "Without the workshop" rules in AGENTS.md.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One run at a time per issue or pull request.
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # So Claude can run the same lint CI runs before it pushes
      # (.claude/settings.json already allows `web-ext lint`).
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install web-ext
        run: npm install --global web-ext

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Caps how long one request can run, to protect usage limits.
          claude_args: "--max-turns 25"
