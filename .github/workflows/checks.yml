name: Checks

# Every push to main and every pull request: the validator, the tests and the
# live check in a hidden Firefox, and, on pull requests, proof that the new
# tests fail without the change. The shared tools come from
# github.com/inklikeurine/firefox-tools, checked out beside this repository
# exactly as on a developer's computer.
#
# This runs the pull request's code, so it gets no secrets and can't write to
# the repository. The guards that a pull request must not be able to switch
# off are in guards.yml.

on:
  push:
    branches: [main]
  pull_request:
    # labeled/unlabeled: re-run when the maintainer adds `no-test-needed`.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  checks:
    name: Validate and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: leanback-for-dropout
          fetch-depth: 0          # history and release tags, for the version check

      - uses: actions/checkout@v7
        with:
          repository: inklikeurine/firefox-tools
          path: firefox-tools

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install the shared tools
        id: setup
        run: |
          npm ci --prefix firefox-tools
          npx --prefix firefox-tools playwright install --with-deps firefox

      # Each check runs even when the one before failed, so one run reports
      # everything; each keeps its output for the report.
      - name: Validate
        id: validate
        working-directory: leanback-for-dropout
        run: |
          mkdir -p ../firefox-tools/out/leanback-for-dropout
          node ../firefox-tools/tools/check.mjs leanback-for-dropout 2>&1 | tee ../firefox-tools/out/leanback-for-dropout/check.log

      - name: Tests and live check
        id: tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: leanback-for-dropout
        run: node ../firefox-tools/harness/run.mjs leanback-for-dropout --spec

      - name: New tests fail without the change
        id: failfirst
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && github.event_name == 'pull_request' }}
        working-directory: leanback-for-dropout
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node ../firefox-tools/tools/fail-first.mjs leanback-for-dropout "$BASE_SHA" 2>&1 | tee ../firefox-tools/out/leanback-for-dropout/fail-first.log

      - name: Show the test logs
        if: failure()
        run: cat firefox-tools/out/leanback-for-dropout/*.log 2>/dev/null || true

      # What failed, in plain words, for report.yml to post on the pull
      # request (this workflow can't write to it: it runs the pull request's
      # code).
      - name: Write the report
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        working-directory: leanback-for-dropout
        env:
          OUTCOME_SETUP: ${{ steps.setup.outcome }}
          OUTCOME_VALIDATE: ${{ steps.validate.outcome }}
          OUTCOME_TESTS: ${{ steps.tests.outcome }}
          OUTCOME_FAILFIRST: ${{ steps.failfirst.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node ../firefox-tools/tools/pr-report.mjs leanback-for-dropout checks || true

      - name: Keep the report
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: pr-report
          path: firefox-tools/out/leanback-for-dropout/report/
          if-no-files-found: ignore
          retention-days: 7
