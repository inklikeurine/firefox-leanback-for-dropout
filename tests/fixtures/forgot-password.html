<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="csrf-token" content="fixture-token">
<title>Dropout reset-password fixture</title>
<style>
.is-hidden, .signin-flow--hidden { display: none; }
</style>
</head>
<body class="site-background-color logged-out">
<!-- Fixture in the shape of Dropout's /forgot_password page (markup copied from the
     2026-10-29 signed-out capture; the token is made up). Test-only behaviour
     is in the script at the end: submitting never leaves the page, and what
     was posted is kept in window.__posted. ?wrong makes "Sign in" answer with
     Dropout's wrong-password error; ?silent makes every submit go unanswered (its button
     left grey, as Rails' own script leaves a data-disable-with button while a
     post is under way). -->
<main class="main-container">
<div class="content-container padding-bottom-none login-box-default-border-top" id="login--box-container" style="border-top: 5px solid #feea3b">
    <section class="auth-section">
  <form action="/login/send_forgot_password_email" method="post" id="forgot-password-form" class="auth-form auth-block-wrapper form" autocomplete="on" data-text-valid-email="Please enter a valid email.">
    <input name="authenticity_token" value="[redacted-csrf]" type="hidden">
    <input name="utf8" type="hidden" value="✓">
    <input name="app_redirect" type="hidden" value="">
    <div class="auth-block-contents auth-forgot-password__container">
        <!-- Branded -->
        <div class="signin-flow-container__branded-content-container--forgot-password">
          <h1 class="site-title text-center margin-bottom-medium">
  <a href="http://watch.dropout.tv" id="login-branded-site-title" style="color: #feea3b" class="login-branded-default-site-title">Dropout</a>
</h1>
          <h1 class="head primary text-center margin-bottom-large">Reset password</h1>
          <div class="flash-error-container">
  <div data-flash="" class="flash-msg-container is-inline
    is-hidden
    ">
    <div class="flash-msg">
    </div> 
  </div>
</div>
        </div>
      <div class="column small-centered margin-top-medium">
        <label for="email">Email address</label>
        <input type="email" name="email" id="email" value="" class="auth-email" autofocus="" required="">
      </div>
      <div class="column small-centered margin-top-medium">
        <input type="submit" value="Reset Password" class="btn btn-teal btn--fill btn--brandon signin-flow__reset-password-btn darken" data-background-color="#feea3b" style="background-color: #feea3b" data-disable-with="Sending...">
          <p class="signin-flow-container__additional-info--sign-in">
            <a href="/login" style="color: #feea3b;">
              Sign in?
            </a>
          </p>
      </div>
    </div>
  </form>
</section>
  </div>
</main>
<script>
(function () {
  // What was posted is kept across the page change Dropout answers with.
  var posted = window.__posted = JSON.parse(sessionStorage.getItem("fixture-posted") || "[]");
  var silent = /[?&]silent\b/.test(location.search);
  var flash = function (text) {
    var b = document.querySelector(".flash-msg-container");
    b.classList.remove("is-hidden");
    b.querySelector(".flash-msg").textContent = text;
  };
  if (/[?&]error\b/.test(location.search)) flash("We couldn't find an account with that email.");
  document.querySelector("#forgot-password-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var email = document.querySelector("#email").value;
    posted.push({ form: "forgot", email: email });
    sessionStorage.setItem("fixture-posted", JSON.stringify(posted));
    if (silent) { e.target.querySelectorAll("[data-disable-with]").forEach(function (b) { b.disabled = true; }); return; }
    if (!/^\S+@\S+\.\S+$/.test(email)) { flash("Please enter a valid email."); return; }
    // Dropout answers a reset with a page of its own.
    location.assign(location.pathname + (/unknown/.test(email) ? "?error" : "?sent"));
  });
})();
</script>
</body>
</html>
